<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TV Global</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

</head>

<body>

<header class="header">

<div class="logo">
📺 TV Global
</div>

<input type="text" id="search" placeholder="Buscar canal...">

</header>

<div class="layout">

<aside class="sidebar">

<h2>Países</h2>

<ul id="country-list"></ul>

</aside>

<main class="content">

<div id="player-section" class="player">

<video id="tv-player" controls></video>

<button class="close-player" onclick="closePlayer()">✖</button>

</div>

<div id="channel-grid" class="grid"></div>

</main>

</div>

<script src="app.js"></script>

</body>
</html>
