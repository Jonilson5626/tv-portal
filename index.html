<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV & Rádio Global</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <header class="top-header">
        <div class="header-container">
            <div class="loader-top"></div>
            <h1 class="site-title">TV & RÁDIO GLOBAL</h1>
            <p class="local-time"><span id="time">1:16 AM</span></p>
        </div>
    </header>

    <main class="main-layout">
        <aside class="sidebar">
            <div class="sidebar-header">🌎 PAÍSES</div>
            <ul id="country-list" class="country-list custom-scroll"></ul>
        </aside>

        <section class="content-area custom-scroll">
            <div id="player-section" class="player-container" style="display: none;">
                <div class="player-nav">
                    <button class="nav-btn" onclick="closePlayer()"><i class="fas fa-arrow-left"></i> VOLTAR</button>
                    <button id="fs-btn" class="nav-btn btn-fs" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> TELA CHEIA</button>
                </div>
                <div class="video-wrapper">
                    <video id="tv-player" controls playsinline></video>
                    <div id="unmute-overlay" class="unmute-overlay" onclick="unmuteVideo()">
                        <i class="fas fa-volume-up"></i> ATIVAR SOM
                    </div>
                </div>
            </div>

            <div class="spotify-main-card">
                <div id="list-header" class="currentplaying-header"></div>
                
                <div class="type-selector">
                    <button id="btn-tv" class="type-btn active" onclick="switchType('tv')"><i class="fas fa-tv"></i> CANAIS TV</button>
                    <button id="btn-radio" class="type-btn" onclick="switchType('radio')"><i class="fas fa-radio"></i> RÁDIOS</button>
                </div>

                <div id="channel-list" class="songs-list"></div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
