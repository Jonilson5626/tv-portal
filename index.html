<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV PORTAL GLOBAL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <header class="top-header">
        <h1><i class="fas fa-satellite-dish"></i> TV PORTAL</h1>
        <div id="status-msg" class="status-bar">Explore programas de TV e Rádios</div>
    </header>

    <main class="main-layout">
        <aside class="sidebar">
            <div class="search-box">
                <input type="text" id="country-search" placeholder="🔍 Procurar país..." onkeyup="filterCountries()">
            </div>
            <ul id="country-list" class="country-list"></ul>
        </aside>

        <section class="content-area">
            
            <div id="player-section" class="player-container" style="display: none;">
                <div class="player-nav">
                    <button class="nav-btn" onclick="closePlayer()"><i class="fas fa-arrow-left"></i> VOLTAR</button>
                    <button id="btn-audio" class="nav-btn btn-danger" onclick="toggleMute()"><i class="fas fa-volume-up"></i> ATIVAR SOM</button>
                    <button class="nav-btn btn-fullscreen" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> TELA CHEIA</button>
                </div>
                <div class="video-wrapper">
                    <video id="tv-player" playsinline muted></video>
                </div>
                <h2 id="playing-now" class="playing-title"></h2>
            </div>

            <div id="radio-player-section" class="radio-container" style="display: none;">
                <div class="player-nav">
                    <button class="nav-btn" onclick="closePlayer()"><i class="fas fa-arrow-left"></i> VOLTAR</button>
                </div>
                
                <div class="radio-content">
                    <img id="radio-logo" src="" alt="Logo Rádio" class="radio-big-logo">
                    
                    <div class="player-bx">
                        <div class="sm-ct">
                            <div class="play-control">
                                <span class="play-btn play" id="BTN-PLAY" onclick="handleRadioPlay()"></span>
                            </div>
                            
                            <div class="info">
                                <span class="title">NO AR:</span>
                                <span id="radio-song" class="song">Conectando...</span>
                            </div>
                        </div>
                        
                        <div class="volume-box">
                            <i class="fas fa-volume-down"></i>
                            <input type="range" id="radio-volume" min="0" max="1" step="0.1" value="1" oninput="changeRadioVolume(this.value)">
                            <i class="fas fa-volume-up"></i>
                        </div>
                    </div>
                </div>
                <h2 id="radio-playing-name" class="playing-title"></h2>
            </div>

            <div id="list-container" style="display: none;">
                <div class="type-selector">
                    <button id="btn-tv" class="type-btn active" onclick="switchType('canais')">CANAIS TV</button>
                    <button id="btn-radio" class="type-btn" onclick="switchType('radios')">RÁDIOS</button>
                </div>
                <div id="channel-grid" class="items-grid"></div>
            </div>

            <div id="welcome-screen" class="welcome-msg">
                <i class="fas fa-globe"></i>
                <h2>Escolha um país na lista lateral</h2>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
