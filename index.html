<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV Online Global</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <header class="top-header">
        <h1><i class="fas fa-tv"></i> TV Online</h1>
    </header>

    <main class="main-layout">
        <aside class="sidebar">
            <div class="sidebar-header">PAÍSES</div>
            <ul id="country-list" class="country-list custom-scroll"></ul>
        </aside>

        <section class="content-area custom-scroll">
            <div id="player-section" class="player-container" style="display: none;">
                <div class="player-nav">
                    <button class="nav-btn" onclick="closePlayer()">
                        <i class="fas fa-arrow-left"></i> VOLTAR
                    </button>
                    <button class="nav-btn expand-btn" onclick="toggleFullScreen()">
                        <i class="fas fa-expand"></i> TELA CHEIA
                    </button>
                </div>
                <div class="video-wrapper">
                    <video id="tv-player" controls playsinline></video>
                </div>
            </div>

            <div id="channel-grid" class="channel-grid"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
