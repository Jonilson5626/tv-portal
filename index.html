<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV GLOBAL AUTO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <header class="top-header">
        <h1><i class="fas fa-globe"></i> IPTV GLOBAL</h1>
        <p id="loading-status">Conectando ao GitHub...</p>
    </header>

    <main class="main-layout">
        <aside class="sidebar">
            <div class="search-box">
                <input type="text" id="search" placeholder="Buscar canal..." onkeyup="filterChannels()">
            </div>
            <div class="info-box">
                <small>Fonte: Free-TV/IPTV</small>
            </div>
        </aside>

        <section class="content-area">
            <div id="player-section" class="player-container" style="display: none;">
                <div class="player-nav">
                    <button class="nav-btn" onclick="closePlayer()"><i class="fas fa-times"></i> FECHAR</button>
                    <button id="btn-audio" class="nav-btn btn-danger" onclick="toggleMute()"><i class="fas fa-volume-up"></i> SOM</button>
                </div>
                <div class="video-wrapper">
                    <video id="tv-player" playsinline muted></video>
                </div>
                <h2 id="playing-now"></h2>
            </div>

            <div id="channel-grid" class="items-grid">
                </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
