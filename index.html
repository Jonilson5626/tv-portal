<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV GLOBAL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <header class="top-header">
        <h1><i class="fas fa-tv"></i> TV & RÁDIO GLOBAL</h1>
        <div id="time" style="color: #60a5fa; font-size: 0.8rem; margin-top: 5px;"></div>
    </header>

    <main class="main-layout">
        <aside class="sidebar">
            <div class="search-box">
                <input type="text" id="country-search" placeholder="Buscar país..." onkeyup="filterCountries()">
            </div>
            <ul id="country-list" class="country-list"></ul>
        </aside>

        <section class="content-area">
            <div id="player-section" class="player-container" style="display: none;">
                <div class="player-nav">
                    <button class="nav-btn" onclick="closePlayer()"><i class="fas fa-arrow-left"></i> VOLTAR</button>
                    <button id="btn-audio-toggle" class="nav-btn btn-danger" onclick="toggleMute()"><i class="fas fa-volume-up"></i> ATIVAR SOM</button>
                    <button class="nav-btn" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> TELA CHEIA</button>
                </div>
                <div class="video-wrapper">
                    <video id="tv-player" playsinline muted></video>
                </div>
                <h2 id="playing-now" style="padding: 15px; font-size: 1.2rem; text-align: center;"></h2>
            </div>

            <div id="list-container" style="display: none;">
                <div class="type-selector">
                    <button id="btn-tv" class="type-btn active" onclick="switchType('tv')">CANAIS TV</button>
                    <button id="btn-radio" class="type-btn" onclick="switchType('radio')">RÁDIOS</button>
                </div>
                <div id="channel-list" class="items-grid"></div>
            </div>

            <div id="welcome-screen" style="text-align: center; padding-top: 50px;">
                <i class="fas fa-globe-americas" style="font-size: 4rem; color: #1e293b;"></i>
                <h2 style="margin-top: 20px; color: #64748b;">Escolha um país para começar</h2>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
