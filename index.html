<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV Online Global</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <header class="top-header">
        <div class="header-container">
            <div class="loader-top"></div> <h1 class="site-title">TV Online Global</h1>
        </div>
    </header>

    <main class="main-layout">
        <aside class="sidebar">
            <div class="sidebar-header">PAÍSES</div>
            <ul id="country-list" class="country-list custom-scroll"></ul>
        </aside>

        <section class="content-area custom-scroll">
            <div id="player-section" class="player-container" style="display: none;">
                <div class="player-nav">
                    <button class="nav-btn" onclick="closePlayer()"><i class="fas fa-arrow-left"></i> VOLTAR</button>
                </div>
                <div class="video-wrapper">
                    <video id="tv-player" controls playsinline></video>
                    <div id="unmute-overlay" class="unmute-overlay" onclick="unmuteVideo()" style="display: none;">
                        <i class="fas fa-volume-up"></i> CLIQUE PARA ATIVAR SOM
                    </div>
                </div>
            </div>

            <div class="spotify-main-card">
                <div id="list-header" class="currentplaying-header">
                    </div>
                <div id="channel-list" class="songs-list">
                    </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
